<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0a09">
    <title>calculadora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="calculadora.css">
</head>

<body>

    <main class="pagina">

        <!-- apresentação -->
        <section class="intro">
            <p class="eyebrow">CALCULADORA <span>/ SIMPLES</span></p>
            <h1 class="titulo">CALCULADORA</h1>
            <p class="descricao">as quatro operações básicas, mais o resto da divisão, direto no navegador. clique nas teclas
                ou use o teclado do computador.</p>

            <ul class="atalhos" aria-label="atalhos do teclado">
                <li><kbd>0–9</kbd> números</li>
                <li><kbd>+ − × ÷</kbd> operações</li>
                <li><kbd>enter</kbd> resultado</li>
                <li><kbd>esc</kbd> limpar</li>
            </ul>
        </section>

        <!-- calculadora -->
        <section class="calculadora" aria-label="calculadora">

            <!-- visor -->
            <div class="visor">
                <p id="conta" class="conta" aria-hidden="true">&nbsp;</p>
                <p id="display" class="display" aria-live="polite">0</p>
            </div>

            <!-- teclas -->
            <div class="teclado">
                <button value="c" class="tecla tecla-funcao tecla-dupla" aria-label="limpar tudo">C</button>
                <button value="%" class="tecla tecla-funcao" aria-label="resto da divisão">%</button>
                <button value="backspace" class="tecla tecla-funcao" aria-label="apagar último número">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
                        <path d="M17 9l-5 5M12 9l5 5" />
                    </svg>
                </button>

                <button value="7" class="tecla">7</button>
                <button value="8" class="tecla">8</button>
                <button value="9" class="tecla">9</button>
                <button value="/" class="tecla tecla-op" aria-label="dividir">÷</button>

                <button value="4" class="tecla">4</button>
                <button value="5" class="tecla">5</button>
                <button value="6" class="tecla">6</button>
                <button value="*" class="tecla tecla-op" aria-label="multiplicar">×</button>

                <button value="1" class="tecla">1</button>
                <button value="2" class="tecla">2</button>
                <button value="3" class="tecla">3</button>
                <button value="-" class="tecla tecla-op" aria-label="subtrair">−</button>

                <button value="0" class="tecla tecla-dupla">0</button>
                <button value="." class="tecla" aria-label="vírgula">,</button>
                <button value="+" class="tecla tecla-op" aria-label="somar">+</button>

                <button value="=" class="tecla tecla-igual" aria-label="resultado">=</button>
            </div>
        </section>

    </main>

    <script src="calculadora.js"></script>

</body>

</html>
